<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kazutom95 - Sonic Moods</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --accent-color: #333;
            --text-color: #222;
            --transition-speed: 0.6s;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all var(--transition-speed) ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Mood Styles */
        body.happy { --bg-color: #FFDE59; --accent-color: #FF914D; --text-color: #5C4033; }
        body.jazzy { --bg-color: #2D1B4E; --accent-color: #00D4FF; --text-color: #E0E0E0; }
        body.upbeat { --bg-color: #FF007F; --accent-color: #39FF14; --text-color: #FFFFFF; }

        .container { text-align: center; z-index: 10; }
        
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }

        .btn-group {
            margin-top: 2rem;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
            transform: scale(1.1);
        }

        /* Simple Visualizer Circles */
        .visualizer {
            display: flex;
            gap: 10px;
            margin-top: 40px;
            height: 50px;
            align-items: center;
        }

        .bar {
            width: 10px;
            height: 20px;
            background-color: var(--accent-color);
            border-radius: 5px;
            animation: bounce 1s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { height: 20px; }
            50% { height: 50px; }
        }
    </style>
</head>
<body class="default">

    <div class="container">
        <h1 id="mood-title">Pick a Vibe</h1>
        <p id="song-name">Select a song to change the atmosphere.</p>

        <div class="visualizer" id="viz">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
        </div>

        <div class="btn-group">
            <button onclick="setMood('happy', 'Sunshine Day', 'Happy')">Happy</button>
            <button onclick="setMood('jazzy', 'Midnight Neon', 'Electric Jazzy')">Electric Jazzy</button>
            <button onclick="setMood('upbeat', 'Hyper Drive', 'Upbeat')">Upbeat</button>
        </div>
    </div>

    <script>
        function setMood(moodClass, song, title) {
            // Change body class for CSS transition
            document.body.className = moodClass;
            
            // Update Text
            document.getElementById('mood-title').innerText = title;
            document.getElementById('song-name').innerText = "Now Playing: " + song;

            // Logic to play/change audio would go here
            console.log("Playing " + song + " in " + moodClass + " mode.");
        }
    </script>
</body>
</html>
