<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matthew Kim - Music 270 Final Project</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --accent-color: #333;
            --text-color: #222;
            --transition-speed: 0.6s;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all var(--transition-speed) ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Mood Styles */
        body.happy { --bg-color: #FFDE59; --accent-color: #FF914D; --text-color: #5C4033; }
        body.jazzy { --bg-color: #2D1B4E; --accent-color: #00D4FF; --text-color: #E0E0E0; }
        body.upbeat { --bg-color: #9b53ad; --accent-color: #6d2b4c; --text-color: #FFFFFF; }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center; 
            width: 100%;
        }
        
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; margin-top: 10px; }

        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50px;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
            transform: scale(1.1);
        }

        /* Simple Visualizer Circles */
        .visualizer {
            display: flex;
            gap: 10px;
            margin: 40px 0;
            height: 150px;
            align-items: center;
            justify-content: center;
        }

        .bar {
            width: 12px;
            height: 40px;
            background-color: var(--accent-color);
            border-radius: 20px;
            transition: background-color var(--transition-speed);
            animation: bounce 1s infinite ease-in-out;
        }

        .bar:nth-child(odd) { animation-duration: 0.8s; }
        .bar:nth-child(3n) { animation-duration: 1.5s; }

        @keyframes bounce {
            0%, 100% { height: 40px; }
            50% { height: 120px; }
        }
    </style>
</head>
<body class="default">

    <div class="container">
        <h1 id="mood-title">Pick a Vibe</h1>
        <p id="song-name">Select a song to change the atmosphere.</p>

        <div class="visualizer" id="viz">
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.2s"></div>
            <div class="bar" style="animation-delay: 0.4s"></div>
            <div class="bar" style="animation-delay: 0.6s"></div>
            <div class="bar" style="animation-delay: 0.3s"></div>
            <div class="bar" style="animation-delay: 0.1s"></div>
            <div class="bar" style="animation-delay: 0.5s"></div>
        </div>

        <div class="btn-group">
            <button onclick="setMood('calm', 'Follow the Water', 'Calm')">Calm</button>
            <button onclick="setMood('a dangerous', 'Invasion of the Unwanted', 'Crisis')">Crisis</button>
            <button onclick="setMood('upbeat', 'Resurrection', 'Upbeat')">Upbeat</button>
        </div>
    </div>

    <script>
        function setMood(moodClass, song, title) {

            // Change body class for CSS transition
            document.body.className = moodClass;
            
            // Update Text
            document.getElementById('mood-title').innerText = title;
            document.getElementById('song-name').innerText = "Now Playing: " + song;

            // Logic to play/change audio would go here
            console.log("Playing " + song + " in " + moodClass + " mode.");

            player.src = song + " mast.mp3";
            player.currentTime = 0;
            player.play();
            
        }
    </script>
</body>
</html>
